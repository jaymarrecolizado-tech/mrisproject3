name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly security scan

jobs:
  security-scan:
    name: Security Scan (Deps + Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for trufflehog
      
      - name: Run TruffleHog (secrets scanning)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --fail --no-verification
      
      - name: Run npm audit
        run: |
          npm ci --audit-level=high
          if [ $? -ne 0 ]; then
            echo "npm audit found vulnerabilities"
            exit 1
          fi
      
      - name: Run composer audit
        working-directory: ./api
        run: |
          composer install --no-progress --prefer-dist --no-dev 2>/dev/null || true
          composer audit --no-check-all --format=plain || true

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run type check
        run: npx tsc --noEmit
      
      - name: Run unit tests
        run: npm run test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info

  php-static-analysis:
    name: PHP Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json

      - name: Install dependencies
        working-directory: ./api
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        working-directory: ./api
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress

  api-tests:
    name: API Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: [security-scan, php-static-analysis]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: dict_mris_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: xdebug
      
      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --no-progress --prefer-dist
      
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root --password='' --silent && break
            sleep 2
          done
      
      - name: Run API tests
        working-directory: ./api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: dict_mris_test
          DB_USER: root
          DB_PASS: ''
          JWT_SECRET: test-secret-key-for-testing-only-32-chars-minimum
          JWT_EXPIRY: 3600
          CORS_ORIGIN: http://localhost:5173
          APP_URL: http://localhost:5173
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./api/coverage.xml

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-tests, api-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build frontend
        run: npm run build
      
      - name: Start preview server
        run: npm run preview -- --host 0.0.0.0 --port 5173 &
        env:
          CI: true
      
      - name: Wait for server
        run: |
          for i in {1..30}; do
            curl -s http://localhost:5173 > /dev/null && break
            sleep 2
          done
      
      - name: Run E2E tests
        run: npm run test:e2e
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: [frontend-tests, api-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7